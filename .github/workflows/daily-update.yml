name: Server Status Update

on:
  schedule:
    # Runs once an hour, offset to :13 past the hour instead of the top of
    # the hour. GitHub queues a huge fraction of all scheduled workflows at
    # round minute marks (:00, :15, :30, :45), which causes delays and
    # sometimes dropped runs during high load. An off-beat minute avoids
    # most of that congestion and keeps the cadence reliable.
    # Cron format: minute hour day month weekday
    - cron: '13 * * * *'
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab too

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run updater
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          MESSAGE_ID: ${{ secrets.MESSAGE_ID }}
          MODE: edit   # or delete_resend
        run: python update_status.py
