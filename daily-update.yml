name: Server Status Update

on:
  schedule:
    # Runs every 15 minutes so the "current time" display stays fresh.
    # Cron format: minute hour day month weekday
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab too

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run updater
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          MESSAGE_ID: ${{ secrets.MESSAGE_ID }}
          MODE: edit   # or delete_resend
        run: python update_status.py
